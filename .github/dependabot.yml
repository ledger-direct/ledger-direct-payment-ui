# New releases wait a week before Dependabot proposes them (cooldown), so a release that is pulled
# again within days never reaches a pull request; security updates are not delayed. Updates within a
# major come as one pull request a week, a new major on its own.
version: 2
updates:
  # The actions in the workflows, pinned to commit SHAs with the version in a comment. Dependabot
  # updates both; all action updates of a week come as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The dependencies in package-lock.json. The runtime ones (xrpl, xrpl-connect, qrcode-generator)
  # are bundled into dist/ and reach all four plugins, so each comes as a pull request of its own:
  # dist/ has to be rebuilt, and an update is a release of this package. Only the development tools
  # are grouped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
