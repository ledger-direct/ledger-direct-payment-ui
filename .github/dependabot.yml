version: 2
updates:
  # The actions in the workflows, pinned to commit SHAs with the version in a comment. Dependabot
  # updates both; all action updates of a week come as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The dependencies in package-lock.json; the runtime ones are bundled into dist/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
